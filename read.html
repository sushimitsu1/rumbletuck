<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Story — Rumbletuck</title>
<meta name="theme-color" content="#11163a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="stylesheet" href="styles.css">
</head>
<body class="reader">
<div class="r-shell">
  <div class="r-top">
    <a class="icon-btn" href="./#stories" aria-label="Back to all stories">←</a>
    <div class="title" id="r-title">Loading…</div>
    <button class="lo-open" id="lo-open" type="button" aria-label="Lights off: hear the whole story with the screen dark" title="Lights off: just the story, no screen"><svg class="lo-moon-ico" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path fill="currentColor" d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1z"/></svg><span>Lights off</span></button>
  </div>
  <div class="r-stage" id="r-stage">
    <img id="r-img" alt="" width="1200" height="900" draggable="false">
    <button class="r-tap prev" id="r-tap-prev" aria-label="Previous page"></button>
    <button class="r-tap next" id="r-tap-next" aria-label="Next page"></button>
    <div class="r-end" id="r-end">
      <div class="box">
        <div style="font-size:2.4rem">🌙</div>
        <h2>The End. Sweet dreams!</h2>
        <p>Enjoyed this one? The full library has <span data-full-count>80+</span> calm vehicle stories.</p>
        <div class="cta-row">
          <a class="btn btn-primary" href="./#waitlist">Join the waitlist</a>
          <a class="btn btn-ghost" href="./#stories">More free stories</a>
        </div>
        <p style="margin-top:14px"><button class="btn btn-ghost" id="r-again" style="min-height:40px">Read again</button></p>
      </div>
    </div>
  </div>
  <p class="r-hint">Tip: turn your phone sideways for bigger pages.</p>
  <div class="r-bottom">
    <button class="icon-btn" id="r-prev" aria-label="Previous page">‹</button>
    <button class="btn btn-primary r-play" id="r-play">▶ Read to me</button>
    <span class="r-count" id="r-count"></span>
    <button class="icon-btn" id="r-next" aria-label="Next page">›</button>
  </div>
</div>
<div class="lo" id="lo" role="dialog" aria-modal="true" aria-labelledby="lo-title" aria-describedby="lo-status" hidden>
  <div class="lo-inner">
    <svg class="lo-moon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path fill="currentColor" d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1z"/></svg>
    <h2 class="lo-title" id="lo-title"></h2>
    <p class="lo-status" id="lo-status" role="status" aria-live="polite"></p>
    <p class="lo-sub" id="lo-sub"></p>
    <div class="lo-ctrls">
      <button class="lo-btn" id="lo-play" type="button" aria-label="Pause">❚❚</button>
      <button class="lo-btn" id="lo-exit" type="button" aria-label="Exit lights-off mode and return to the pictures">✕</button>
    </div>
    <fieldset class="lo-timer">
      <legend>Sleep timer</legend>
      <label><input type="radio" name="lo-timer" value="off"> Off</label>
      <label><input type="radio" name="lo-timer" value="end"> End of story</label>
      <label><input type="radio" name="lo-timer" value="15"> 15 min</label>
      <label><input type="radio" name="lo-timer" value="30"> 30 min</label>
    </fieldset>
    <label class="lo-next"><input type="checkbox" id="lo-next"> Play the next story</label>
  </div>
</div>
<script src="config.js"></script>
<script src="stories.js"></script>
<script src="reader.js"></script>
<script src="lightsoff.js"></script>
<script src="yt.js"></script>
</body>
</html>
